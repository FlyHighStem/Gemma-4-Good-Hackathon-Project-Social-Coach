<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealWorld AI | Scenario Trainer</title>
    <link rel="stylesheet" href="../static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="glass-card main-container">
        <header>
            <div class="logo-area">
                <span class="emoji-icon">🎭</span>
                <h1>RealWorld <span class="accent">AI</span></h1>
            </div>
            <p class="subtitle"><strong>Master high-stakes conversations with Gemma-powered simulations.<strong></strong></p>
        </header>

        <section class="scenario-selection">
            <h3>1. Choose Your Scenario</h3>
            <div class="grid">
                <div class="option-card active" onclick="selectScenario('job_interview', this)">
                    <div class="icon"><h4>💼 Job Interview</h4></div>
                    <p>Practice answering tough questions for your dream role.</p>
                </div>
                <div class="option-card" onclick="selectScenario('social_practice', this)">
                    <div class="icon"><h4>🤝 Social Practice</h4></div>
                    <p>Practice small talk and making new friends.</p>
                </div>
            </div>
        </section>

        <section class="difficulty-selection">
            <h3>2. Set the Difficulty</h3>
            <div class="select-wrapper">
                <select id="difficulty">
                    <option value="easy">Easy — Friendly & Supportive</option>
                    <option value="medium">Medium — Professional & Neutral</option>
                    <option value="hard">Hard — Strict & Challenging</option>
                </select>
            </div>
        </section>
        <br>
        <button class="btn-primary" onclick="startSession()">
            Start Roleplay →
        </button>
    </div>

    <script>
        let selectedScenario = 'job_interview';

        function selectScenario(id, element) {
            selectedScenario = id;
            // UI Toggle
            document.querySelectorAll('.option-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
        }

        function startSession() {
            const diff = document.getElementById('difficulty').value;
            // Redirect to chat with params
            window.location.href = `/chat?scenario=${selectedScenario}&diff=${diff}`;
        }
    </script>
</body>
</html>
